services:

  postgres:
    container_name: recovery_strategies_postgres
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: recovery_strategies_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - recovery_db_check_copy:/var/lib/postgresql/data

  adminer:
    container_name: recovery_strategies_adminer
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    container_name: recovery_strategies_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:latest
    container_name: recovery_strategies_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  recovery_db_check_copy:
    external: true
  redis-data:
  minio-data:
